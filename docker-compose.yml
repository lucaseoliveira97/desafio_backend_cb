version: '3.8'

networks:
  aw-network:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: prometheus
    networks:
      - aw-network
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml